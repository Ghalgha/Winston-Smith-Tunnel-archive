name: WSTT release

on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: wstt-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_FILE: /tmp/wstt-release.jks
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine version and prevent overwriting an existing release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$version" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify release signing secrets
        shell: bash
        run: |
          missing=()
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.31.1"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
          test -d "$SDK_ROOT/platforms/android-37"
      - name: Restore signing key
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
      - name: Verify PowerShell for provenance checks
        run: pwsh --version
      - name: Install Rust and build native Android libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build
          chmod +x scripts/build_android_native.sh
          scripts/build_android_native.sh
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build Linux server binaries and embedded web panel
        run: |
          cargo install cargo-zigbuild --locked
          chmod +x rust-server/build_linux.sh
          rust-server/build_linux.sh --no-tests
          for asset in csqtt-linux-amd64 csqtt-linux-arm64 csqtt-linux-armv7; do
            test -s "app/src/main/assets/$asset"
          done
      - name: Build signed release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -s "app/src/main/jniLibs/$abi/libclient.so"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: WSTT ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            WSTT ${{ steps.version.outputs.version }}.
            Signed release APKs for installation and updates.
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
