name: Import and prepare WST sources
on:
  push:
    paths:
      - '.github/workflows/import-archive.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wst-source
          unzip -q csqtt-main.zip -d /tmp/wst-source
          source_dir="$(find /tmp/wst-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$source_dir"
          rsync -a --exclude='local.properties' --exclude='.git' "$source_dir"/ ./
          rm -f local.properties csqtt-main.zip
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import project sources from archive"
          git push
