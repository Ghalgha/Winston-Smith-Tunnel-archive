name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.31.1"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
          test -d "$SDK_ROOT/platforms/android-37"
      - name: Verify PowerShell for provenance checks
        run: pwsh --version
      - name: Install Rust and build native Android libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build
          chmod +x scripts/build_android_native.sh
          scripts/build_android_native.sh
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build Linux server binaries and embedded web panel
        run: |
          cargo install cargo-zigbuild --locked
          chmod +x rust-server/build_linux.sh
          rust-server/build_linux.sh --no-tests
          for asset in csqtt-linux-amd64 csqtt-linux-arm64 csqtt-linux-armv7; do
            test -s "app/src/main/assets/$asset"
          done
      - name: Build debug APK for CI verification only
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug
          for abi in arm64-v8a armeabi-v7a x86_64; do
            found=false
            for apk in app/build/outputs/apk/debug/*.apk; do
              if unzip -l "$apk" | grep -q "lib/$abi/libclient.so"; then
                found=true
                break
              fi
            done
            if [ "$found" != true ]; then
              echo "Missing native client library for $abi in debug APK outputs" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: WSTT-${{ github.sha }}-CI-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
