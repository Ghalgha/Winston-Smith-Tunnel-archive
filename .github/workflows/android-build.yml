name: Android debug build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
          test -d "$SDK_ROOT/platforms/android-37"
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WST-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
